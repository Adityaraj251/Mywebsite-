<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b14">
  <title>Inquiry Received | ADI WEBDEVELOPER</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .thank-you-page{min-height:100vh;display:grid;place-items:center;padding:30px}
    .thank-you-card{max-width:620px;text-align:center;border:1px solid var(--border-strong);border-radius:24px;padding:clamp(30px,7vw,65px);background:linear-gradient(145deg,rgba(15,23,42,.92),rgba(8,11,20,.95));box-shadow:0 30px 80px rgba(0,0,0,.28)}
    .thank-icon{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;margin:0 auto 25px;background:rgba(6,182,212,.12);border:1px solid rgba(6,182,212,.3);color:#67e8f9;font-size:28px}
    .thank-you-card h1{font-size:clamp(35px,7vw,54px);line-height:1.1;letter-spacing:-.06em;margin:18px 0}
    .thank-you-card p{color:var(--muted);font-size:14px;line-height:1.8;margin-bottom:25px}
    .thank-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  </style>
</head>
<body>
  <main class="thank-you-page">
    <section class="thank-you-card">
      <div class="thank-icon" aria-hidden="true">✓</div>
      <div class="eyebrow" style="justify-content:center">INQUIRY SUBMITTED</div>
      <h1>Thanks for reaching out.</h1>
      <p>Your inquiry has been submitted to the website form. Aditya can review your project details and follow up using the contact information you provided.</p>
      <div class="thank-actions">
        <a class="button button-primary" href="/">Back to website <span aria-hidden="true">↗</span></a>
        <a class="button button-secondary" href="https://wa.me/917780078796?text=Hello%20Aditya%2C%20I%20just%20submitted%20a%20website%20inquiry." target="_blank" rel="noopener">Continue on WhatsApp</a>
      </div>
    </section>
  </main>
</body>
</html>
